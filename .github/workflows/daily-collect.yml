# 매일 DART 공시를 수집해 Supabase에 반영
# 필요 Secrets (GitHub 저장소 > Settings > Secrets and variables > Actions):
#   DART_API_KEY, DATABASE_URL
name: daily-collect

on:
  schedule:
    - cron: "0 19 * * *"        # 매일 04:00 KST (UTC 19:00)
  workflow_dispatch:             # Actions 탭에서 수동 실행
    inputs:
      budget:
        description: "DART 호출 예산"
        default: "18000"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_BUDGET: ${{ github.event.inputs.budget || '18000' }}
        run: python collector/run.py
