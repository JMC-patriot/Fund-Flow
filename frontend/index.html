<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fundflow 자금조달 모니터</title>
<meta name="description" content="회사채·CB·BW·EB·RCPS·유상증자·IPO 발행 지표, 만기 모니터, 발행사 재무 시뮬레이션">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2; --surface:#fcfcfb; --line:#e4e3df; --track:#ecebe7;
  --text:#0b0b0b; --text-2:#52514e; --muted:#7a7974;
  --accent:#2a78d6; --sel:#eef4fc; --warn:#c2410c; --warn-bg:#fdf1e9;
  --equity:#2a78d6; --debt:#eb6834;
  --SB:#2a78d6; --CB:#e0662f; --BW:#7a5bd0; --EB:#1a9a86; --RCPS:#c2417a;
  --EQUITY:#d8a21a; --IPO:#4f9a3a; --CP:#7d838f; --STB:#a9aeb8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211; --surface:#1a1a19; --line:#2c2c2a; --track:#262624;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
    --accent:#6da7ec; --sel:#1d2733; --warn:#fb923c; --warn-bg:#2a1d14;
    --equity:#3987e5; --debt:#d95926;
    --SB:#4b91e8; --CB:#ef7d48; --BW:#9a80e6; --EB:#2fb8a2; --RCPS:#e0609a;
    --EQUITY:#e6b43a; --IPO:#6dba55; --CP:#9aa0ab; --STB:#6c717b;
  }
}
:root[data-theme="dark"]{
  --bg:#121211; --surface:#1a1a19; --line:#2c2c2a; --track:#262624;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86;
  --accent:#6da7ec; --sel:#1d2733; --warn:#fb923c; --warn-bg:#2a1d14;
  --equity:#3987e5; --debt:#d95926;
  --SB:#4b91e8; --CB:#ef7d48; --BW:#9a80e6; --EB:#2fb8a2; --RCPS:#e0609a;
  --EQUITY:#e6b43a; --IPO:#6dba55; --CP:#9aa0ab; --STB:#6c717b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  font-feature-settings:"tnum";line-height:1.45;word-break:keep-all;font-size:14px}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}

header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:18px;height:58px}
.logo{font-weight:700;font-size:18px;letter-spacing:-.02em;white-space:nowrap;text-decoration:none;color:var(--text)}
.logo span{color:var(--accent)}
nav.tabs-main{display:flex;gap:2px;height:100%}
nav.tabs-main a{display:flex;align-items:center;padding:0 14px;text-decoration:none;color:var(--text-2);
  border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
nav.tabs-main a.on{color:var(--text);border-color:var(--accent)}
.search{position:relative;flex:1;max-width:320px;margin-left:auto}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px}
.search input:focus{outline:none;border-color:var(--accent)}
.sugg{position:absolute;top:40px;left:0;right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);list-style:none;margin:0;padding:4px;display:none;max-height:380px;overflow-y:auto;z-index:5}
.sugg.on{display:block}
.sugg li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.sugg li.act,.sugg li:hover{background:var(--sel)}
.sugg small{color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none}

main{padding:24px 0 60px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 10px}
.sub{color:var(--muted);margin:0;font-size:13px}
.sec{margin-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.grid-eq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.na{color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:12px}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--text-2)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:2px;background:var(--c,var(--accent))}
.chip.on{border-color:var(--c,var(--accent));color:var(--text);background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--surface));font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 11px;height:30px;font-size:13px;cursor:pointer;color:var(--text-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--sel);color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.field input,.field select{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;color:var(--text);font-size:13px;min-width:0}
.field input[type=month]{width:140px}
.btn{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:0 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:inherit}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:right;padding:0 7px 8px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:8px 7px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.l{text-align:left}
td.nm{font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis}
td.wrap-txt{white-space:normal;min-width:160px;max-width:260px;color:var(--text-2);font-size:12px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sel)}
tr.soon td{background:color-mix(in srgb,var(--warn-bg) 70%,transparent)}
tr.soon:hover td{background:var(--sel)}
.dday{font-weight:600}
.dday.hot{color:var(--warn)}
.amt{font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;
  color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.pill{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--track);color:var(--text-2)}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.scroll-y{max-height:640px;overflow:auto}

/* company */
.co-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.co-h h1{font-size:26px}
.sim-in{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sim-out td:first-child{text-align:left;color:var(--text-2)}
.up{color:var(--debt)} .down{color:var(--equity)}
.fs-tabs{margin:10px 0}
.fs td.acc{text-align:left;white-space:normal;min-width:200px}

.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--surface);font-size:12px;
  padding:6px 9px;border-radius:6px;opacity:0;transition:opacity .1s;z-index:40;max-width:340px}
.skel{color:var(--muted);padding:18px 0}
footer{border-top:1px solid var(--line);padding:18px 0 36px;font-size:12px;color:var(--muted)}

@media (max-width:980px){
  .grid2,.grid-eq{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:700px){
  .wrap{padding:0 16px}
  header .wrap{flex-wrap:wrap;height:auto;padding-top:8px;padding-bottom:0;gap:8px}
  .search{order:2;max-width:none;flex-basis:calc(100% - 46px)}
  nav.tabs-main{order:3;flex-basis:100%;height:40px}
  nav.tabs-main a{padding:0 10px}
  .hide-m{display:none}
  .kpi .v{font-size:18px}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="#/macro">fund<span>flow</span></a>
    <nav class="tabs-main">
      <a href="#/macro" data-tab="macro">개요</a>
      <a href="#/monitor" data-tab="monitor">만기 Monitor</a>
      <a href="#/company" data-tab="company">회사 상세</a>
    </nav>
    <div class="search">
      <input id="q" type="search" placeholder="회사명 또는 종목코드" autocomplete="off" aria-label="회사 검색">
      <ul class="sugg" id="sugg"></ul>
    </div>
    <button class="icon-btn" id="theme" aria-label="테마 전환">◐</button>
  </div>
</header>
<main class="wrap" id="view"><div class="skel">불러오는 중…</div></main>
<footer><div class="wrap">데이터: 금융감독원 DART OpenAPI · 매일 자동 업데이트 · <span id="loaded"></span> ·
  <a id="api-docs" target="_blank" rel="noopener">API 문서</a><br>
  정기보고서 기반 항목(사모 회사채·CP·신용등급·상환 여부)은 보고서 제출 시점 기준이며, 투자 판단 전 공시 원문을 확인하세요.</div></footer>
<div class="tip" id="tip"></div>

<script>
const API = (window.FUNDFLOW_API || "http://localhost:8000").replace(/\/$/, "");
const TYPES = ["SB","CB","BW","EB","RCPS","EQUITY","IPO","CP","STB"];
const LABEL = {SB:"회사채",CB:"전환사채",BW:"신주인수권부사채",EB:"교환사채",RCPS:"상환전환우선주",EQUITY:"유상증자",IPO:"IPO",CP:"기업어음",STB:"단기사채"};
const SHORT = {SB:"SB",CB:"CB",BW:"BW",EB:"EB",RCPS:"RCPS",EQUITY:"유증",IPO:"IPO",CP:"CP",STB:"단기사채"};
const DEBT = ["SB","CB","BW","EB","CP","STB"];
const MAIN6 = ["SB","CB","BW","EB","RCPS","EQUITY","IPO"];
const BONDS = ["SB","CB","BW","EB"];
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

/* ── 포맷 ── */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const won = v => {
  if (v == null || isNaN(v)) return "–";
  if (!v) return "0";
  const eok = v / 1e8;
  if (Math.abs(eok) >= 10000) return (eok / 10000).toLocaleString("ko-KR", {maximumFractionDigits: 2}) + "조";
  if (Math.abs(eok) >= 1) return Math.round(eok).toLocaleString("ko-KR") + "억";
  return (v / 1e4).toLocaleString("ko-KR", {maximumFractionDigits: 0}) + "만";
};
const eok = v => v == null || isNaN(v) ? "–" : (v / 1e8).toLocaleString("ko-KR", {maximumFractionDigits: 0});
const pct = (v, d = 2) => v == null || isNaN(v) ? "–" : (+v).toFixed(d) + "%";
const n0 = v => v == null || isNaN(v) ? "–" : Math.round(v).toLocaleString("ko-KR");
const dt = s => s ? s.replaceAll("-", ".") : "–";
const tag = t => `<span class="tag" style="--c:var(--${t})">${SHORT[t]}</span>`;
const CLS = {Y: "유가", K: "코스닥", N: "코넥스", E: "비상장"};

const qs = o => { const p = new URLSearchParams();
  Object.entries(o).forEach(([k, v]) => { if (v != null && v !== "") p.set(k, v); });
  const s = p.toString(); return s ? "?" + s : ""; };
const get = (path, o = {}) => fetch(API + path + qs(o)).then(async r => {
  if (!r.ok) { let m = r.status; try { m = (await r.json()).detail || m; } catch {} throw new Error(`${path}: ${m}`); }
  return r.json(); });

/* ── 툴팁 ── */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest?.("[data-tip]");
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.max(4, e.clientY - tip.offsetHeight - 10) + "px";
});

/* ── 공통 차트: 누적 막대 ── */
function stackedBars(periods, types, val, {W = 720, H = 260, fmt = won, labelEvery} = {}) {
  if (!periods.length) return '<p class="na">데이터 없음</p>';
  const tot = periods.map(p => types.reduce((a, t) => a + (val(p, t) || 0), 0));
  if (!Math.max(...tot)) return '<p class="na">데이터 없음 (수집 중이면 잠시 후 다시 확인하세요)</p>';
  const max = Math.max(...tot), pb = 24, pt = 20, pl = 4;
  const step = (W - pl) / periods.length, bw = Math.max(3, step * 0.66), y = v => v / max * (H - pb - pt);
  const every = labelEvery || Math.ceil(periods.length / 14);
  let g = `<line x1="0" x2="${W}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>`;
  periods.forEach((p, i) => {
    const x = pl + step * i + (step - bw) / 2; let base = H - pb;
    const det = types.filter(t => val(p, t)).map(t => `${SHORT[t]} ${fmt(val(p, t))}`).join(" · ");
    types.forEach(t => { const v = val(p, t); if (!v) return; const h = y(v); base -= h;
      g += `<rect x="${x}" y="${base}" width="${bw}" height="${Math.max(h - 1, .6)}" fill="var(--${t})"/>`; });
    g += `<rect x="${pl + step * i}" y="${pt}" width="${step}" height="${H - pb - pt}" fill="transparent" data-tip="${esc(`${p} 합계 ${fmt(tot[i])} — ${det}`)}"/>`;
    if (i % every === 0) g += `<text x="${x + bw / 2}" y="${H - 7}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(p.length > 4 ? p.slice(2).replace("-", ".") : p)}</text>`;
  });
  const mi = tot.indexOf(max);
  g += `<text x="${Math.min(Math.max(pl + step * mi + step / 2, 28), W - 28)}" y="${pt - 6}" text-anchor="middle" font-size="11" fill="var(--text-2)">${fmt(max)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
const legend = types => `<div class="legend">${types.map(t => `<span><i style="background:var(--${t})"></i>${LABEL[t]}</span>`).join("")}</div>`;
const chips = (types, on, attr) => types.map(t => `<button class="chip ${on.includes(t) ? "on" : ""}" style="--c:var(--${t})" data-${attr}="${t}"><i></i>${SHORT[t]}</button>`).join("");

/* ══════════════ 1. 개요 (Macro) ══════════════ */
const M = {unit: "year", types: [...MAIN6], metric: "amount"};
async function viewMacro(el) {
  el.innerHTML = `
    <div class="row between"><div><h1>자금조달 Macro 지표</h1><p class="sub" id="m-range">연도별·월별 증권 종류별 발행량과 발행 건수</p></div>
      <div class="row"><div class="seg" id="m-unit"><button data-u="year">연도별</button><button data-u="month">월별</button></div>
        <div class="seg" id="m-metric"><button data-k="amount">발행금액</button><button data-k="count">건수</button></div></div></div>
    <div class="chips sec" id="m-types">${chips(TYPES, M.types, "mt")}</div>
    <div class="kpis sec" id="m-kpis"></div>
    <div class="grid2 sec">
      <div class="panel"><h3 id="m-ctitle"></h3>${legend(M.types)}<div id="m-chart"></div></div>
      <div class="panel"><h3>잔존 채무증권 만기 분포 <span class="na" style="font-weight:400">(오늘 기준)</span></h3>
        <div id="m-wall"></div><p class="note">막대를 누르면 해당 만기 구간을 Monitor에서 엽니다.</p></div>
    </div>
    <div class="panel sec"><div class="row between"><h3 style="margin:0">기간 × 유형 표</h3><button class="btn" id="m-csv">CSV</button></div>
      <div class="tbl-wrap scroll-y" style="margin-top:8px"><table id="m-table"></table></div></div>`;
  $$("#m-unit button", el).forEach(b => b.classList.toggle("on", b.dataset.u === M.unit));
  $$("#m-metric button", el).forEach(b => b.classList.toggle("on", b.dataset.k === M.metric));
  el.onclick = e => {
    const u = e.target.closest("[data-u]"), k = e.target.closest("[data-k]"), t = e.target.closest("[data-mt]");
    if (u) { M.unit = u.dataset.u; viewMacro(el); }
    if (k) { M.metric = k.dataset.k; viewMacro(el); }
    if (t) { const c = t.dataset.mt; M.types = M.types.includes(c) ? M.types.filter(x => x !== c) : TYPES.filter(x => M.types.includes(x) || x === c); viewMacro(el); }
    const b = e.target.closest("[data-bucket]");
    if (b) { Object.assign(MO, {status: "outstanding", types: DEBT.filter(x => M.types.includes(x)).join(",") || DEBT.join(","), ...BUCKET_RANGE(b.dataset.bucket), page: 0}); location.hash = "#/monitor"; }
  };
  const [rows, wall] = await Promise.all([get("/api/macro", {unit: M.unit, types: M.types.join(",")}),
                                          get("/api/maturities", {types: M.types.join(",")})]);
  const periods = [...new Set(rows.map(r => r.period))].sort();
  const by = {}; rows.forEach(r => (by[r.period] ||= {})[r.sec_type] = r);
  const val = (p, t) => by[p]?.[t]?.[M.metric] || 0;
  const fmt = M.metric === "amount" ? won : v => n0(v) + "건";
  $("#m-ctitle").textContent = `${M.unit === "year" ? "연도별" : "월별"} ${M.metric === "amount" ? "발행금액" : "발행 건수"}`;
  $("#m-chart").innerHTML = stackedBars(periods, M.types, val, {fmt});
  if (periods.length) $("#m-range").textContent = `${periods[0]} – ${periods.at(-1)} · 발행일 기준 · 정정·중복 공시 제외`;

  // KPI: 최근 기간 vs 전 기간
  const last = periods.at(-1), prev = periods.at(-2);
  const sum = (p, k) => M.types.reduce((a, t) => a + (by[p]?.[t]?.[k] || 0), 0);
  const chg = (a, b) => b ? `${a >= b ? "▲" : "▼"} ${Math.abs((a - b) / b * 100).toFixed(1)}% vs ${prev}` : "";
  const outAmt = wall.reduce((a, r) => a + r.amount, 0), soon = wall.filter(r => ["0-3m", "3-6m"].includes(r.bucket)).reduce((a, r) => a + r.amount, 0);
  $("#m-kpis").innerHTML = last ? `
    <div class="kpi"><div class="k">${last} 발행금액</div><div class="v">${won(sum(last, "amount"))}</div><div class="s">${chg(sum(last, "amount"), sum(prev, "amount"))}</div></div>

function BUCKET_RANGE(b) {
  const d = new Date(), ym = x => x.toISOString().slice(0, 7), add = m => { const x = new Date(d); x.setMonth(x.getMonth() + m); return x; };

}

  const calc = () => {
    const f = fins[S.base], X = S.amount * 1e8, r = S.conv / 100;
    let A = +f.total_assets, L = +f.total_liab, E = +f.total_equity, CA = +f.current_assets || null, CL = +f.current_liab || null;
    const cols = [["발행 전", A, L, E, CA, CL]];
    const debtLike = ["SB", "CB", "BW", "EB", "CP"].includes(S.type) || (S.type === "RCPS" && S.rcps === "liab");
    // 발행 직후
    let a = A + X, l = L, e = E, ca = CA != null ? CA + X : null, cl = CL;
    if (debtLike) { l += X; if (cl != null && (S.current || S.type === "CP")) cl += X; } else e += X;
    if (S.use === "repay") { a -= X; l -= X; if (ca != null) ca -= X; if (cl != null) cl -= Math.min(X, cl); }
    cols.push(["발행 직후", a, l, e, ca, cl]);
    // 전환·행사 후
    if (["CB", "EB"].includes(S.type) || (S.type === "RCPS" && S.rcps === "liab")) {
      cols.push([`${S.conv}% 전환 후`, a, l - X * r, e + X * r, ca, cl != null && (S.current) ? cl - X * r : cl]);
    } else if (S.type === "BW") {
      cols.push([`${S.conv}% 행사 후`, a + X * r, l, e + X * r, ca != null ? ca + X * r : null, cl]);
    }
    const ratio = (x, y) => y > 0 ? x / y * 100 : null;
    const interest = debtLike ? X * S.rate / 100 : 0;
    const rows = [
      ["자산총계", c => eok(c[1])], ["부채총계", c => eok(c[2])], ["자본총계", c => eok(c[3])],
      ["부채비율", c => c[3] > 0 ? pct(ratio(c[2], c[3]), 1) : '<span class="na">자본잠식</span>', true],
      ["자기자본비율", c => pct(ratio(c[3], c[1]), 1), true],
      ["유동비율", c => c[4] != null && c[5] ? pct(ratio(c[4], c[5]), 1) : "–", true]];
    const base = cols[0];
    $("#s-out", p).innerHTML = `<thead><tr><th class="l">(억원)</th>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>` +
      rows.map(([l, fn, isR]) => `<tr><td>${l}</td>${cols.map((c, i) => {
        let cls = "";
        if (isR && i > 0) { const k = l === "부채비율" ? [2, 3] : l === "자기자본비율" ? [3, 1] : [4, 5];
          const v0 = ratio(base[k[0]], base[k[1]]), v1 = ratio(c[k[0]], c[k[1]]);
          if (v0 != null && v1 != null && Math.abs(v1 - v0) > .05) cls = (l === "부채비율" ? v1 > v0 : v1 < v0) ? "up" : "down"; }
        return `<td class="${cls}">${fn(c)}</td>`; }).join("")}</tr>`).join("") +
      `<tr><td>연 이자비용(추가)</td><td>–</td><td colspan="${cols.length - 1}" style="text-align:left">${debtLike ? `${eok(interest)}억원 · 영업이익 대비 ${f.op_income > 0 ? pct(interest / (f.op_income * (f.reprt_code === "11011" ? 1 : {"11013": 4, "11012": 2, "11014": 4 / 3}[f.reprt_code])) * 100, 1) : "–"}` : "없음 (지분증권)"}</td></tr></tbody>`;
    $("#s-note", p).textContent = `기준: ${f.report} (${f.fs_div}) ${dt(f.base_date)}. 발행비용·파생상품부채 분리·이자 발생 이후 실적은 제외한 단순 추정입니다. ` +
      (S.type === "EB" ? "EB는 자기주식 교환 시 부채가 자본으로 이동한다고 가정합니다." : S.type === "BW" ? "BW는 신주인수권 행사 대금이 현금으로 들어오고 사채는 남는다고 가정합니다." : "");
    $("#s-conv-w", p).style.display = ["CB", "BW", "EB", "RCPS"].includes(S.type) ? "" : "none";
    $("#s-rcps-w", p).style.display = S.type === "RCPS" ? "" : "none";
  };
  p.addEventListener("input", e => {
    const id = e.target.id;
    if (id === "s-base") S.base = +e.target.value; if (id === "s-type") S.type = e.target.value;
    if (id === "s-amount") S.amount = +e.target.value || 0; if (id === "s-rate") S.rate = +e.target.value || 0;
    if (id === "s-conv") S.conv = Math.min(100, Math.max(0, +e.target.value || 0)); if (id === "s-use") S.use = e.target.value;
    if (id === "s-rcps") S.rcps = e.target.value; if (id === "s-current") S.current = e.target.checked;
    if (id === "s-pick" && e.target.value !== "") {
      const s = secs[+e.target.value];
      S.type = typeOpts.includes(s.sec_type) ? s.sec_type : s.sec_type === "STB" ? "CP" : "SB";
      S.amount = Math.round(s.amount / 1e8); S.rate = s.coupon ?? S.rate;
      S.current = s.days_left != null && s.days_left <= 365;
      const bi = fins.findIndex(f => s.issue_date && f.base_date < s.issue_date); S.base = bi >= 0 ? bi : 0;
      sync();
    }
    calc();
  });
  sync(); calc();
}

/* ── 전체 재무제표 ── */
function renderFS(p, code, fins) {
  const reps = fins.filter(f => f.reprt_code === "11011" || fins.indexOf(f) < 4);
  if (!reps.length) { p.innerHTML = '<h3>전체 재무제표</h3><p class="na">재무 데이터가 없습니다.</p>'; return; }
  p.innerHTML = `<div class="row between"><h3 style="margin:0">전체 재무제표</h3>
    <div class="row"><select id="fs-rep" class="btn">${reps.map((f, i) => `<option value="${i}">${esc(f.report)}</option>`).join("")}</select>
    <select id="fs-div" class="btn"><option value="CFS">연결</option><option value="OFS">별도</option></select></div></div>
    <div class="seg fs-tabs" id="fs-sj"></div><div class="tbl-wrap scroll-y" id="fs-body"><p class="na">불러오는 중…</p></div>`;
  let data = null, sj = "BS";
  const SJ = {BS: "재무상태표", IS: "손익계산서", CIS: "포괄손익계산서", CF: "현금흐름표", SCE: "자본변동표"};
  const draw = () => {
    const have = [...new Set(data.lines.map(l => l.sj_div))];
    if (!have.includes(sj)) sj = have[0];
    $("#fs-sj", p).innerHTML = have.map(k => `<button data-sj="${k}" class="${k === sj ? "on" : ""}">${SJ[k] || k}</button>`).join("");
    const L = data.lines.filter(l => l.sj_div === sj);
    $("#fs-body", p).innerHTML = L.length ? `<table class="fs"><thead><tr><th class="l">계정 (억원)</th><th>당기</th><th>전기</th><th class="hide-m">전전기</th></tr></thead><tbody>${
      L.map(l => `<tr><td class="acc">${esc(l.account_nm)}</td><td>${eok(l.this)}</td><td>${eok(l.prev)}</td><td class="hide-m">${eok(l.prev2)}</td></tr>`).join("")}</tbody></table>`
      : '<p class="na">해당 보고서의 재무제표가 없습니다. 연결/별도를 바꿔 보세요.</p>';
  };
  const load = async () => {
    const f = reps[+$("#fs-rep", p).value];
    $("#fs-body", p).innerHTML = '<p class="na">DART에서 불러오는 중…</p>';
    try { data = await get(`/api/companies/${code}/statements`, {bsns_year: f.bsns_year, reprt_code: f.reprt_code, fs_div: $("#fs-div", p).value});
      if (!data.lines.length) { $("#fs-sj", p).innerHTML = ""; $("#fs-body", p).innerHTML = '<p class="na">해당 보고서의 재무제표가 없습니다. 연결/별도를 바꿔 보세요.</p>'; return; }
      draw(); }
    catch (e) { $("#fs-body", p).innerHTML = `<p class="na">${esc(e.message)}</p>`; }
  };
  $("#fs-div", p).value = fins[0].fs_div === "별도" ? "OFS" : "CFS";
  p.addEventListener("change", e => { if (e.target.matches("select")) load(); });
  p.addEventListener("click", e => { const b = e.target.closest("[data-sj]"); if (b) { sj = b.dataset.sj; draw(); } });
  load();
}

/* ── CSV ── */
function csv(name, rows) {
  const s = "﻿" + rows.map(r => r.map(v => { v = v ?? ""; v = String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; }).join(",")).join("\n");
  const a = Object.assign(document.createElement("a"), {href: URL.createObjectURL(new Blob([s], {type: "text/csv"})), download: name});
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ── 검색 ── */
const qIn = $("#q"), sugg = $("#sugg");
let sTimer, hits = [], act = 0;
function drawSugg() {
  sugg.innerHTML = hits.length ? hits.map((h, i) => `<li data-hit="${h.corp_code}" class="${i === act ? "act" : ""}">
    <span>${esc(h.corp_name)} <small>${esc(h.stock_code || CLS[h.corp_cls] || "")}</small></span><small>잔존 ${won(h.outstanding)} · ${h.count}건</small></li>`).join("")
    : '<li class="na" style="cursor:default">검색 결과 없음</li>';
  sugg.classList.add("on");
}
qIn.addEventListener("input", () => {
  clearTimeout(sTimer); const q = qIn.value.trim();
  if (!q) { sugg.classList.remove("on"); return; }
  sTimer = setTimeout(async () => { hits = await get("/api/companies", {q, limit: 10}).catch(() => []); act = 0; drawSugg(); }, 200);
});
qIn.addEventListener("keydown", e => {
  if (!sugg.classList.contains("on") || !hits.length) return;
  if (e.key === "ArrowDown") { act = (act + 1) % hits.length; drawSugg(); e.preventDefault(); }
  if (e.key === "ArrowUp") { act = (act - 1 + hits.length) % hits.length; drawSugg(); e.preventDefault(); }
  if (e.key === "Enter") pick(hits[act].corp_code);
});
const pick = code => { sugg.classList.remove("on"); qIn.value = ""; qIn.blur(); location.hash = "#/company/" + code; };
document.addEventListener("click", e => {
  const h = e.target.closest("[data-hit]"); if (h) return pick(h.dataset.hit);
  if (!e.target.closest(".search")) sugg.classList.remove("on");
});

/* ── 테마 ── */
const root = document.documentElement;
try { const t = localStorage.getItem("ff-theme"); if (t) root.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("ff-theme", root.dataset.theme); } catch {}
};

/* ── 라우터 ── */
let lastCo = "";
async function route() {
  const [, tab = "macro", arg] = location.hash.replace(/^#/, "").split("/");
  if (tab === "company" && arg) lastCo = arg;
  $$("nav.tabs-main a").forEach(a => a.classList.toggle("on", a.dataset.tab === tab));
  $('nav.tabs-main a[data-tab="company"]').href = "#/company" + (lastCo ? "/" + lastCo : "");
  const el = $("#view"); el.onclick = null;
  scrollTo(0, 0);
  try {
    if (tab === "monitor") await viewMonitor(el);
    else if (tab === "company") await viewCompany(el, arg);
    else await viewMacro(el);
  } catch (e) {
    el.innerHTML = `<div class="panel"><h3>데이터를 불러오지 못했습니다</h3>
      <p class="na" style="margin:0">API 서버(${esc(API)})에 연결할 수 없습니다. 무료 서버는 첫 요청 때 깨어나는 데 30~60초 걸릴 수 있으니 잠시 후 새로고침해 주세요.</p>
      <p class="note">${esc(e.message)}</p></div>`;
  }
}
addEventListener("hashchange", route);
$("#api-docs").href = API + "/docs";
get("/api/meta").then(m => {
  $("#loaded").textContent = m.last_loaded ? `최근 적재 ${m.last_loaded}` : "";
  if (m.pending_filings > 50) $("#loaded").textContent += ` · 초기 수집 진행 중 (남은 공시 ${m.pending_filings.toLocaleString()}건)`;
}).catch(() => {});
route();
</script>
